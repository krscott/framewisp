name: CI cancellation benchmark

on:
  push:
    branches: [ "t3code/reduce-github-ci-time-1" ]
    paths:
    - .github/workflows/ci-cancellation-benchmark.yml
    - .github/ci-cancellation-trigger

permissions:
  contents: read

concurrency:
  group: ci-cancellation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Simulate work superseded by another commit
      run: sleep 60
