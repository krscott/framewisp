name: Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check Format
      run: |
        nix run -L .#format
        git diff --exit-code

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Lint
      run: nix run -L .#lint

    - name: Check Develop Shell
      run: nix develop --command bash -c 'framewisp --help'

    - name: Test CLI and library
      run: nix develop --command python -m pytest --basetemp "$RUNNER_TEMP/framewisp-tests"

    - name: Preserve failed test artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failed-test-artifacts
        path: ${{ runner.temp }}/framewisp-tests
        retention-days: 7

    - name: Test and Build
      run: nix build -L

    - name: Test standalone package
      run: nix flake check -L

    - name: Check nix
      run: nix flake show '.?submodules=1'
