name: CI benchmark

on:
  push:
    branches: [ "t3code/reduce-github-ci-time-1" ]
    paths:
    - .github/workflows/ci-benchmark.yml
    - .github/benchmark-trigger

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: serial-1
          workers: 1
          serial: true
          cache: false
        - name: serial-4
          workers: 4
          serial: true
          cache: false
        - name: serial-8
          workers: 8
          serial: true
          cache: false
        - name: split-4
          workers: 4
          serial: false
          cache: false
        - name: split-8
          workers: 8
          serial: false
          cache: false
        - name: cached-8
          workers: 8
          serial: true
          cache: true
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Restore and save Nix store
      if: matrix.cache
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: ci-benchmark-${{ runner.os }}-${{ github.run_id }}
    - name: Change source without changing behavior
      run: |
        printf '\n# Benchmark source variation: %s\n' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> framewisp/__init__.py
    - name: Lint
      if: matrix.serial
      run: nix run -L .#lint
    - name: Check development shell
      if: matrix.serial
      run: nix develop --command bash -c 'framewisp --help'
    - name: Test development shell GUI and X11 diagnostics
      if: matrix.serial
      run: |
        nix develop --command python -m pytest \
          tests/test_integration.py::test_agent_can_see_type_and_click \
          tests/test_x11.py \
          tests/test_tempdirs.py \
          --durations=25 --basetemp "$RUNNER_TEMP/framewisp-tests"
    - name: Build package and run unit tests
      run: nix build -L
    - name: Test standalone package
      env:
        WORKERS: ${{ matrix.workers }}
      run: nix build -L ".#ci-benchmark-$WORKERS"
    - name: Check Nix outputs
      run: nix flake show '.?submodules=1'
    - uses: actions/upload-artifact@v4
      with:
        name: junit-${{ matrix.name }}-${{ github.run_attempt }}
        path: result/junit.xml

  quality:
    name: split-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Lint
      run: nix run -L .#lint
    - name: Check development shell
      run: nix develop --command bash -c 'framewisp --help'
    - name: Test development shell GUI and X11 diagnostics
      run: |
        nix develop --command python -m pytest \
          tests/test_integration.py::test_agent_can_see_type_and_click \
          tests/test_x11.py \
          tests/test_tempdirs.py \
          --durations=25 --basetemp "$RUNNER_TEMP/framewisp-tests"

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Check format
      run: |
        nix run -L .#format
        git diff --exit-code
