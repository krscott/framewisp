[project]
name = "framewisp"
version = "0.1.0"
requires-python = ">=3.10.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

dependencies = [
    "vncdotool~=1.2",
    "PyGObject",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy~=1.9",
    "pyright",
    "pytest",
    "pygobject-stubs",
    "pillow",
]

[project.scripts]
framewisp = "framewisp.__main__:main"
framewisp-demo = "framewisp.demo:main"

[build-system]
requires = ["setuptools >= 77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["framewisp"]

[tool.setuptools.package-data]
"framewisp" = ["py.typed", "SKILL.md"]

[tool.isort]
profile = "black"
skip = [".direnv", "result", ".venv"]

[tool.black]
target-version = ["py310"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
exclude = [".direnv", "result", ".venv"]

[tool.mypy]
strict = true
exclude = [".direnv", "result", ".venv"]

# Improved error messages
pretty = true
show_column_numbers = true
show_error_context = true

[tool.pytest.ini_options]
markers = [
    "integration: black-box integration tests that require installed executables",
]

[[tool.mypy.overrides]]
module = ["vncdotool", "vncdotool.*"]
ignore_missing_imports = true
